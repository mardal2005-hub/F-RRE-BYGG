<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Siden finnes ikke | Førre Bygg</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#161619">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css?v=35">
  <style>
    .err{min-height:66vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(50px,8vw,90px) 20px}
    .err__code{font-family:var(--serif);font-weight:500;font-size:clamp(78px,18vw,168px);line-height:.9;color:var(--sand-deep);letter-spacing:-.02em}
    .err h1{font-size:clamp(26px,4vw,42px);margin:10px 0 16px}
    .err p{color:var(--muted);font-size:17px;max-width:46ch;margin:0 auto 30px}
    .err__actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .err__lang{margin-top:26px;font-size:14px}
    .err__lang a{color:var(--sand-deep);border-bottom:1px solid var(--line)}
    .err__lang a:hover{border-color:var(--sand-deep)}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <div class="container masthead__row">
        <span></span>
        <a href="/" class="masthead__brand" aria-label="Førre Bygg – forsiden">
          <span class="masthead__word">Førre&nbsp;Bygg</span>
        </a>
        <span></span>
      </div>
    </div>
  </header>

  <main class="err">
    <div class="err__code">404</div>
    <h1>Siden finnes ikke</h1>
    <p>Beklager – vi fant ikke siden du lette etter. Den kan være flyttet eller ha fått en ny adresse.</p>
    <div class="err__actions">
      <a href="/" class="btn btn--ink btn--lg">Til forsiden</a>
      <a href="/#kontakt" class="btn btn--ghost btn--lg">Kontakt oss</a>
    </div>
    <p class="err__lang"><a href="/en/" hreflang="en" lang="en">Page not found – go to the English site →</a></p>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="border-top:0">
        <span>© Førre Bygg – Byggefirma i Tysvær · Haugalandet</span>
        <span><a href="tel:+4794876708">+47 948 76 708</a></span>
      </div>
    </div>
  </footer>
</body>
</html>
