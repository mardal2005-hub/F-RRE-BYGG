<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Moderne norsk bolig i landskap">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12324f"/>
      <stop offset="0.55" stop-color="#1c496e"/>
      <stop offset="1" stop-color="#2d5f85"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a58"/>
      <stop offset="1" stop-color="#0f2a41"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede1"/>
      <stop offset="1" stop-color="#e4d6c2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a678"/>
      <stop offset="1" stop-color="#a97f4f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a648a"/>
      <stop offset="1" stop-color="#16344e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#f5d9ae" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5d9ae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <path d="M0 470 L280 360 L520 430 L760 340 L1040 420 L1320 350 L1600 430 L1600 1000 L0 1000 Z" fill="url(#hill)" opacity="0.85"/>
  <path d="M0 640 L1600 640 L1600 1000 L0 1000 Z" fill="#0e2740"/>
  <!-- house -->
  <g>
    <rect x="560" y="500" width="520" height="200" fill="url(#wall)"/>
    <rect x="560" y="500" width="150" height="200" fill="url(#wood)"/>
    <polygon points="540,500 820,405 1100,500" fill="#12324f"/>
    <rect x="750" y="560" width="120" height="140" fill="url(#glass)"/>
    <rect x="900" y="560" width="70" height="70" fill="url(#glass)"/>
    <rect x="990" y="560" width="70" height="70" fill="url(#glass)"/>
    <rect x="605" y="560" width="60" height="140" fill="#12324f" opacity="0.65"/>
    <rect x="560" y="694" width="520" height="6" fill="#0e2740" opacity="0.4"/>
  </g>
  <!-- foreground terrace line -->
  <rect x="0" y="700" width="1600" height="4" fill="#c9a678" opacity="0.25"/>
</svg>
